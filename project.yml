name: PlaceRating
options:
  bundleIdPrefix: com.magdzaky
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: W4D7HW9L4Y
    CODE_SIGN_STYLE: Automatic
    # CI sets CURRENT_PROJECT_VERSION to a new build number for every TestFlight upload.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 13.2.3
targets:
  PlaceRating:
    type: application
    platform: iOS
    sources:
      - PlaceRating
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magdzaky.PlaceRating
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Google sign-in: the iOS OAuth client id from Google Cloud and its reversed form.
        # Left empty, the Google button stays hidden.
        GOOGLE_CLIENT_ID: ""
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.not-configured
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: PlaceRating/Info.plist
      properties:
        CFBundleDisplayName: Stoop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS: no export compliance documents, and TestFlight doesn't ask each build.
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - ar
        UILaunchScreen: {}
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLName: shared-place
            CFBundleURLSchemes:
              - stoop
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Your location is shown to friends you accept, while the app is open.
        NSLocationAlwaysAndWhenInUseUsageDescription: With nearby alerts on, Stoop checks your rough location in the background to tell you when a friend is within 500 m. Nobody sees it on the map.
        NSCameraUsageDescription: Take a photo of a place or its menu to add it to Stoop.
        NSPhotoLibraryAddUsageDescription: Save place and menu photos from Stoop to your library.
    dependencies:
      - package: GoogleSignIn
        products: [GoogleSignIn, GoogleSignInSwift]
      - package: Nuke
        products: [Nuke, NukeUI]
    entitlements:
      path: PlaceRating/PlaceRating.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:place-rating-api-production.up.railway.app
        # development here; exporting for App Store Connect switches it to production
        aps-environment: development
    postBuildScripts:
      - name: Allow local networking in Debug
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist" || true
            # a real phone reaching the development server on a Mac triggers iOS's local network prompt
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Debug builds reach the development server on your Mac.'" "$plist" || true
          fi
    scheme:
      testTargets:
        - PlaceRatingTests
  PlaceRatingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlaceRatingTests
    dependencies:
      - target: PlaceRating
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.magdzaky.PlaceRatingTests
