<!doctype html>
<!-- LinkedIn launch post, 1080 x 1350 (4:5). Render: node marketing/linkedin/render.cjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stoop launch post</title>
<style>
  :root {
    --navy: #12233F;
    --navy-deep: #0C1830;
    --cream: #F7F3E8;
    --sand: #EFE7D3;
    --gold: #F4B740;
    --gold-ink: #B87A00;
    --muted: #4A5A75;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: radial-gradient(120% 70% at 85% 0%, #FFFBF1 0%, var(--cream) 45%, var(--sand) 100%);
    color: var(--navy);
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: absolute; top: 64px; left: 72px; right: 72px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 6px 18px rgba(18, 35, 63, .18); }
  .brand span { font-size: 40px; font-weight: 800; letter-spacing: -0.5px; }
  .pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--navy); color: var(--cream);
    padding: 14px 24px; border-radius: 999px;
    font-size: 20px; font-weight: 700; letter-spacing: 2px;
  }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 5px rgba(244, 183, 64, .25); }

  .copy { position: absolute; top: 196px; left: 72px; right: 72px; }
  h1 { font-size: 92px; line-height: 0.98; font-weight: 800; letter-spacing: -3px; }
  h1 em { font-style: normal; color: var(--gold-ink); }
  .sub { margin-top: 26px; font-size: 29px; line-height: 1.35; color: var(--muted); font-weight: 500; max-width: 820px; }

  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; height: 600px;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-radius: 56px 56px 0 0;
  }
  .star { position: absolute; fill: var(--gold); }

  .phone {
    position: absolute; width: 290px; aspect-ratio: 1320 / 2868;
    background: #0B1220; border-radius: 48px; padding: 11px;
    box-shadow: 0 30px 60px rgba(6, 12, 26, .45), 0 0 0 2px #2A3650 inset;
  }
  .phone img { width: 100%; height: 100%; border-radius: 38px; display: block; object-fit: cover; }
  .phone.left  { left: 92px;  top: 690px; transform: rotate(-7deg); width: 262px; }
  .phone.right { right: 92px; top: 690px; transform: rotate(7deg);  width: 262px; }
  .phone.mid   { left: 50%; top: 600px; transform: translateX(-50%); z-index: 2; width: 310px; }

  footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 132px; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; padding: 0 72px;
    background: linear-gradient(180deg, rgba(12, 24, 48, 0) 0%, var(--navy-deep) 38%);
  }
  footer .cta { color: var(--cream); font-size: 30px; font-weight: 700; letter-spacing: -0.3px; }
  footer .cta b { color: var(--gold); }
  footer img { height: 64px; }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="../screenshots/public/app-icon.png" alt=""><span>Stoop</span></div>
    <div class="pill"><i></i>NOW ON THE APP STORE</div>
  </header>

  <section class="copy">
    <h1>Your friends.<br>Your places.<br><em>One map.</em></h1>
    <p class="sub">See friends move on the map, rate the cafés and spots you love, and get a heads-up when a friend is close.</p>
  </section>

  <div class="panel"></div>
  <svg class="star" style="right: 150px; top: 330px; width: 120px; transform: rotate(12deg)" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.3L12 17.7 5.7 21.5l1.7-7.3L2 9.5l7.1-.6z"/></svg>
  <svg class="star" style="right: 92px; top: 290px; width: 44px; opacity: .55; transform: rotate(-10deg)" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.3L12 17.7 5.7 21.5l1.7-7.3L2 9.5l7.1-.6z"/></svg>

  <div class="phone left"><img src="../screenshots/public/screenshots/apple/iphone/en/02-place.jpg" alt=""></div>
  <div class="phone right"><img src="../screenshots/public/screenshots/apple/iphone/en/07-nearby.jpg" alt=""></div>
  <div class="phone mid"><img src="../screenshots/public/screenshots/apple/iphone/en/01-map.jpg" alt=""></div>

  <footer>
    <div class="cta">Try it with your friends. <b>Free on iPhone.</b></div>
    <img src="https://toolbox.marketingtools.apple.com/api/v2/badges/download-on-the-app-store/white/en-us" alt="Download on the App Store">
  </footer>
</body>
</html>
