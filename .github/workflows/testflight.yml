# Tests every push to main, then archives the app and uploads it to TestFlight.
#
# Needs three repository secrets from an App Store Connect API key
# (App Store Connect > Users and Access > Integrations > Team Keys, role Admin so Xcode can
# create the distribution certificate and profile itself):
#   APP_STORE_CONNECT_KEY_ID      the key's id
#   APP_STORE_CONNECT_ISSUER_ID   the issuer id shown above the keys
#   APP_STORE_CONNECT_KEY         the contents of the downloaded AuthKey_<id>.p8
# Optional repository variables for Google sign-in: GOOGLE_CLIENT_ID and GOOGLE_REVERSED_CLIENT_ID.
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run the tests
        run: |
          set -o pipefail
          # the newest available iPhone simulator, whatever the runner image ships
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d["udid"]) for runtime, items in devices.items() if "iOS" in runtime
                    for d in items if d["name"].startswith("iPhone")]
          print(sorted(phones)[-1][1])')
          xcodebuild test \
            -project PlaceRating.xcodeproj -scheme PlaceRating \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 30 -maximum-test-execution-time-allowance 60

  testflight:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the App Store Connect key is set
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY" ]; then
            echo "::error::Add APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_KEY to the repository secrets."
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ vars.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          set -o pipefail
          # a new, always-increasing build number for every upload
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          GOOGLE_SETTINGS=()
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_REVERSED_CLIENT_ID" ]; then
            GOOGLE_SETTINGS=(GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID")
          fi
          xcodebuild archive \
            -project PlaceRating.xcodeproj -scheme PlaceRating -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Stoop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${GOOGLE_SETTINGS[@]}"
          echo "Build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Stoop.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
